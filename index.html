
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Location Register Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom scrollbar styles */
      /* For Webkit-based browsers (Chrome, Safari, Edge) */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      
      /* Dark mode scrollbar */
      html.dark ::-webkit-scrollbar-thumb {
        background-color: rgba(100, 116, 139, 0.5); /* slate-500 with opacity */
        border-radius: 10px;
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(100, 116, 139, 0.8);
      }

      /* Light mode scrollbar */
      html.light ::-webkit-scrollbar-thumb {
        background-color: rgba(148, 163, 184, 0.5); /* slate-400 with opacity */
        border-radius: 10px;
      }
      html.light ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(148, 163, 184, 0.8);
      }

      /* For Firefox */
      html.dark {
        scrollbar-width: thin;
        scrollbar-color: rgba(100, 116, 139, 0.5) transparent;
        background-color: #020617; /* slate-900, fallback for main view */
      }
      html.light {
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.5) transparent;
        background-color: #f1f5f9; /* slate-100 */
      }
      
      /* Animation for timeline entries */
      @keyframes fade-in-slide-up {
        from {
          opacity: 0;
          transform: translateY(1rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .timeline-item-enter {
        opacity: 0; /* Start hidden before animation */
        animation: fade-in-slide-up 0.5s ease-out forwards;
      }
      
      .print-only {
        display: none;
      }

      /* Custom styles for range inputs (video player) */
      input[type="range"].range-sm {
          -webkit-appearance: none;
          appearance: none;
          background: transparent;
          cursor: pointer;
      }

      /* Webkit (Chrome, Safari) */
      input[type="range"].range-sm::-webkit-slider-runnable-track {
          background: rgba(255, 255, 255, 0.3);
          height: 0.25rem;
          border-radius: 0.5rem;
      }
      input[type="range"].range-sm::-webkit-slider-thumb {
          -webkit-appearance: none;
          appearance: none;
          margin-top: -4px; /* centers thumb on track */
          height: 12px;
          width: 12px;
          background-color: white;
          border-radius: 50%;
          border: 1px solid rgba(0,0,0,0.2);
          transition: transform 0.1s ease-in-out;
      }
       input[type="range"].range-sm:hover::-webkit-slider-thumb {
          transform: scale(1.2);
       }

      /* Firefox */
      input[type="range"].range-sm::-moz-range-track {
          background: rgba(255, 255, 255, 0.3);
          height: 0.25rem;
          border-radius: 0.5rem;
      }
      input[type="range"].range-sm::-moz-range-thumb {
          height: 12px;
          width: 12px;
          background-color: white;
          border-radius: 50%;
          border: 1px solid rgba(0,0,0,0.2);
          transition: transform 0.1s ease-in-out;
      }
      input[type="range"].range-sm:hover::-moz-range-thumb {
          transform: scale(1.2);
       }

      /* Styles for vertical volume slider */
      .volume-popup {
        position: absolute;
        bottom: calc(100% + 10px);
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(26, 26, 26, 0.8);
        border-radius: 8px;
        padding: 16px 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 130px;
      }

      input[type=range].vertical-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100px;
        height: 5px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 5px;
        outline: none;
        transform: rotate(-90deg);
        cursor: pointer;
      }

      input[type=range].vertical-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        background: #fff;
        cursor: pointer;
        border-radius: 50%;
      }

      input[type=range].vertical-slider::-moz-range-thumb {
        width: 14px;
        height: 14px;
        background: #fff;
        cursor: pointer;
        border-radius: 50%;
      }

      /* Seek Tooltip */
      .seek-tooltip {
        position: absolute;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-family: monospace;
        white-space: nowrap;
        pointer-events: none;
        bottom: 100%;
        margin-bottom: 8px;
        opacity: 0;
        transition: opacity 0.1s ease;
      }


      /* Print styles */
      @media print {
        body {
          -webkit-print-color-adjust: exact !important;
          color-adjust: exact !important;
          background-color: #fff;
          font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body * {
          visibility: hidden;
        }

        .printable-area, .printable-area * {
          visibility: visible;
        }
        .printable-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: auto;
          padding: 0;
          margin: 0;
        }
        
        .print-hide, .screen-view {
          display: none !important;
        }

        .print-only {
          display: block !important;
        }

        @page {
          size: A4;
          margin: 15mm; /* Reduced margin */
        }

        .print-container {
          color: #000;
          font-size: 9pt; /* Reduced base font size */
        }

        .print-header {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          border-bottom: 1px solid #333; /* Thinner border */
          padding-bottom: 0.75rem; /* Reduced padding */
          margin-bottom: 1.5rem; /* Reduced margin */
        }

        .print-header h1 {
          font-size: 22pt; /* Reduced font size */
          font-weight: bold;
          margin: 0;
          color: #000;
        }
        
        .print-header .logo {
          display: flex;
          align-items: center;
        }

        .print-header .logo-box {
          width: 35px; /* Slightly smaller */
          height: 35px; /* Slightly smaller */
          background-color: #f59e0b !important;
          margin-right: 0.75rem; /* Reduced margin */
        }
        
        .print-header h2 {
           font-size: 13pt; /* Reduced font size */
           font-weight: bold;
           color: #000;
           margin-bottom: 0.25rem;
        }

        .print-header-details {
          text-align: right;
          font-size: 9pt;
        }
        
        .print-container h3 {
          font-size: 11pt; /* Reduced font size */
          font-weight: bold;
          border-bottom: 1px solid #eee; /* Lighter border */
          padding-bottom: 0.4rem; /* Adjusted padding */
          margin-top: 1.5rem;
          margin-bottom: 1rem;
          color: #000;
        }

        .print-details-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0.75rem; /* Reduced gap */
          margin-bottom: 1.5rem; /* Reduced margin */
        }
        
        .print-details-grid .detail-item {
          padding: 0.5rem;
          background-color: #f8f8f8 !important; /* Lighter background */
          border: 1px solid #eee !important;
          border-radius: 4px;
        }

        .print-details-grid .detail-item .label {
          font-size: 7pt; /* Reduced font size */
          color: #555;
          text-transform: uppercase;
          margin-bottom: 2px;
        }
        
        .print-details-grid .detail-item .value {
          font-weight: bold;
          font-size: 10pt; /* Reduced font size */
        }
        
        .print-details-grid .detail-item-full {
           grid-column: span 2;
        }

        .print-details-grid .value-large {
          font-size: 14pt !important; /* Reduced font size */
        }
        
        .print-products-table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 1rem;
        }
        
        .print-products-table th, .print-products-table td {
          border: 1px solid #eee; /* Lighter border */
          padding: 0.5rem; /* Reduced padding */
          text-align: left;
          vertical-align: top;
        }

        .print-products-table th {
          background-color: #f8f8f8 !important; /* Lighter background */
          font-weight: bold;
          text-transform: uppercase;
          font-size: 8pt; /* Reduced font size */
        }

        .print-products-table td {
          font-size: 9pt; /* Reduced font size */
        }
        
        .print-products-table .text-right {
          text-align: right;
        }
        
        .print-products-table .total-row td {
          font-weight: bold;
          font-size: 11pt; /* Reduced font size */
          background-color: #f8f8f8 !important; /* Lighter background */
          border-top: 2px solid #ddd;
        }
        
        .print-footer {
          margin-top: 2rem; /* Reduced margin */
          padding-top: 0.75rem; /* Reduced padding */
          border-top: 1px solid #eee; /* Lighter border */
          font-size: 7pt; /* Reduced font size */
          color: #777;
          text-align: center;
        }

        /* New styles for receipt printing */
        .receipt-print-container {
            font-family: 'Courier New', monospace;
            color: #000;
            font-size: 10pt;
            width: 80mm;
            margin: 0 auto;
        }
        .receipt-print-container .logo-box {
            width: 40px;
            height: 40px;
            background-color: #f59e0b !important;
            margin: 0 auto 0.5rem;
        }
        .receipt-print-container h3, .receipt-print-container p {
            text-align: center;
            margin: 0;
            color: #000;
        }
        .receipt-print-container h3 { font-size: 14pt; font-weight: bold; }
        .receipt-print-container p.receipt-subtitle { font-size: 10pt; font-weight: normal; margin-bottom: 1rem; }

        .receipt-print-container hr {
            border: none;
            border-top: 1px dashed #000;
            margin: 0.5rem 0;
        }
        .receipt-print-container .details p {
            text-align: left;
            margin: 2px 0;
            display: flex;
            justify-content: space-between;
        }
        .receipt-print-container .details p span:first-child {
            font-weight: bold;
        }
        .receipt-print-container table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
        }
        .receipt-print-container table th, .receipt-print-container table td {
            padding: 2px 0;
            text-align: left;
        }
        .receipt-print-container table th {
            border-bottom: 1px dashed #000;
            text-transform: uppercase;
        }
        .receipt-print-container .text-right { text-align: right; }
        .receipt-print-container .text-center { text-align: center; }
        .receipt-print-container .total-row td {
            font-weight: bold;
            font-size: 11pt;
            padding-top: 0.5rem;
        }
        .receipt-print-container .footer {
            margin-top: 1rem;
            text-align: center;
            font-size: 9pt;
        }
      }
    </style>
